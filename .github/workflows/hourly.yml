name: Hourly business-class fare check

on:
  schedule:
    - cron: "0 * * * *"      # top of every hour (UTC)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write              # needed to commit the regenerated page

concurrency:
  group: fare-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fare check
        env:
          SERPAPI_KEY:           ${{ secrets.SERPAPI_KEY }}
          # Email alerts via AgentMail (alerts send only when this is set):
          AGENTMAIL_API_KEY:     ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID:    ${{ vars.AGENTMAIL_INBOX_ID }}   # optional; auto-discovered if blank
          # Overrides:
          ALERT_TO:              ${{ vars.ALERT_TO || 'jeannekang@hotmail.com' }}
          THRESHOLD_USD:         ${{ vars.THRESHOLD_USD || '6500' }}
        run: python check_flights.py

      - name: Commit updated page
        run: |
          git config user.name  "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "Update fares ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
